<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0c10" />
  <script>
    // The theme has to be on the document before the browser paints, which is
    // earlier than the module bundle runs - a theme applied from there shows as
    // a flash of the wrong palette. This is the same read the prefs store does
    // (see src/ui/prefs.ts): what the user chose, else light, the app's own
    // default. The operating system is deliberately not consulted.
    (() => {
      let theme = 'light';
      try {
        const stored = JSON.parse(localStorage.getItem('inkfilm.prefs.v1') || '{}');
        if (stored && (stored.theme === 'light' || stored.theme === 'dark')) theme = stored.theme;
      } catch {
        /* corrupt or blocked storage: the default still stands */
      }
      document.documentElement.dataset.theme = theme;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f3ec' : '#0d0c10');
    })();
  </script>
  <title>Ink &amp; Film — a continuous imagined stream</title>
  <meta name="description" content="Real ink blots, imagined by a vision model, realised as one unbroken film you can direct." />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app" data-mode="studio">
    <header id="topbar">
      <div class="brand">
        <span class="mark"></span>
        <h1>Ink &amp; Film</h1>
      </div>
      <div class="status" data-slot="status"></div>
      <div class="top-actions" data-slot="actions"></div>
    </header>

    <div id="notes"></div>

    <main>
      <aside id="rail" class="panel-rail" aria-label="Blots"></aside>

      <section id="stage">
        <div id="film">
          <video id="player" playsinline autoplay></video>
          <div id="hud" hidden></div>
          <div id="preparing" hidden></div>
        </div>
        <div id="paper"></div>
      </section>

      <aside id="controls" class="panel-controls" aria-label="Controls">
        <section id="telemetry" class="telemetry-pad"></section>
        <div id="control-body"></div>
      </aside>
    </main>

    <footer id="filmstrip" class="panel-filmstrip" aria-label="Blots"></footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
